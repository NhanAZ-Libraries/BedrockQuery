description: Query Bedrock server status through MCSRVSTAT, NetherNet and UDP
commands:
  query:
    permission: bedrockquery.cmd
    description: Querying server information (MCSRVSTAT, NetherNet or UDP)
    usage: "/query <domain/ip[:port]> [port] (e.g. /query test.pmmp.io 19132)"
    permission-message: §e>§c You do not have permission to use this command!

permissions:
  bedrockquery.cmd:
    default: op
    description: Allow querying other servers information
...
